name: Publiceer actuele Introweek-app

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write

concurrency:
  group: introweek-mirror
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Haal actuele productiebron op
        uses: actions/checkout@v4
        with:
          repository: Inholland-LM/Introweek-app
          ref: main

      - name: Installeer pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Gebruik Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Installeer dependencies
        run: pnpm install --frozen-lockfile

      - name: Pas offline startpad aan voor het alternatieve adres
        run: sed -i 's#/Introweek-app/#/introweek-test/#g' public/sw.js

      - name: Bouw dezelfde app met dezelfde backend
        run: pnpm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_AUTH_ENABLED: ${{ vars.VITE_AUTH_ENABLED }}

      - name: Publiceer naar de gh-pages-branch
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          touch dist/.nojekyll
          cd dist
          git init
          git checkout -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "Publiceer actuele Introweek-app"
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
